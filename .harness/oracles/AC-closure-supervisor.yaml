id: AC-closure-supervisor
requirement: Fresh scoped authority and sole durable execution ownership precede every supervised effect
criticality: critical
status: TEST_READY
observable: Two controller processes sharing one intent issue one dispatch; expired operation authority issues none; literal output paths produce actual exact changed bytes
oracle:
  expected: Only the newly created journal reservation owns dispatch, every fresh start rechecks its closed operation authority after preflight, and every required capability output is materialized
cases:
  positive:
  - Canonical and derived output batches include the literal root filename __proto__ and report actual byte deltas and one charge
  negative:
  - Deployment, rollback, readback, artifact acceptance, objective or review policy expires during preflight and no reservation or dispatch occurs
  - Prerequisite evidence expires during preflight while execution budget remains current and the stale next obligation cannot start
  boundary:
  - Separate processes pause after both observed absence and before descriptor publication; the second receives no fresh dispatch ownership
  - Owner exits after durable reservation before POST; original-key resumption remains uncertain without redispatch
context: Real local journal and child processes, ephemeral test signatures, fixed HTTPS interception, accepted documents and controlled test clock; no external execution
side_effects:
  must:
  - Preserve one durable charge and pending intent for uncertainty, exact changed output bytes, frozen-file bytes and scope
  must_not:
  - Create a second external start, invent an observation, alter public APPENDED receipts or stored schemas, or bypass action-specific authority
false_positive: Count actual transport starts from separate PIDs and replay the real journal; assert literal file contents and scope in addition to status; expired cases retain unchanged spend and no pending reservation
owner: harness-kit maintainers under AGENTS.md and the authorized GR01 GR02 GR04 closure brief
evidence:
  formats:
  - Preserved defective source bytes and hashes, unchanged fresh regression bytes, actual nonzero RED log and receipt, matching GREEN log
  - Local engineering evidence only; remote supervisor enforcement and live acceptance remain unexecuted
tests:
- packs/autonomy/repo-template/scripts/quality-orchestrator/tests/closure-global-corrections.test.mjs
- packs/autonomy/repo-template/scripts/quality-orchestrator/tests/closure-fixtures.mjs
- packs/autonomy/repo-template/scripts/quality-orchestrator/tests/closure-process-worker.mjs
falsification:
  defect: Idempotent append dispatches twice across processes; asynchronous preflight drops action and prerequisite freshness; inherited output setter loses literal output bytes
  proved_sha: 0a51623b5db42951a6091847a179262182abd67d
  receipt: docs/implementation/2026-09-07-closure/global-corrections/red-receipt.json
